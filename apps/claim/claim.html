<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claim your payment — Kese</title>
    <!--
      No analytics, no third-party anything. The claim secret rides in this page's URL fragment,
      and every extra script is another party that could read it.
    -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
    <style>
      @import "./src/tokens.css";

      body { display: grid; place-items: center; min-height: 100vh; padding: 1.5rem; }
      main { width: 100%; max-width: 26rem; }

      .card {
        background: var(--raise);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.75rem;
      }

      h1 { font-size: 1.3rem; font-weight: 600; margin: .3rem 0 0; }
      .sub { margin: .5rem 0 0; color: var(--text-2); font-size: .92rem; }

      .amount {
        font-family: var(--display);
        font-size: 2.6rem; font-weight: 700; letter-spacing: -.03em;
        margin: 1.25rem 0 .25rem;
      }

      .rows { margin: 1.25rem 0 0; }
      .row {
        display: flex; justify-content: space-between; gap: 1rem;
        padding: .65rem 0; border-top: 1px solid var(--line);
        font-size: .875rem; color: var(--text-2);
      }
      .row b { font-family: var(--mono); font-weight: 400; color: var(--text); }

      .notice {
        margin: 1.25rem 0 0;
        padding: .85rem 1rem;
        border: 1px solid color-mix(in oklab, var(--ask) 30%, transparent);
        background: color-mix(in oklab, var(--ask) 8%, transparent);
        border-radius: 9px;
        font-size: .82rem; color: var(--text-2);
      }
      .notice strong { color: var(--ask); font-weight: 500; }

      button.claim {
        width: 100%; margin-top: 1.25rem; padding: .8rem 1rem;
        font: inherit; font-weight: 500; color: var(--ground);
        background: var(--allow); border: 0; border-radius: 9px; cursor: pointer;
      }
      button.claim:hover { filter: brightness(1.08); }
      button.claim:disabled { opacity: .45; cursor: not-allowed; }

      .status { margin: .9rem 0 0; font-size: .85rem; color: var(--text-3); min-height: 1.2em; }

      .sample {
        margin: 0 0 1.25rem; padding: .7rem .9rem;
        border: 1px dashed var(--line-2); border-radius: 8px;
        font-size: .78rem; color: var(--text-3);
      }
      .sample strong { color: var(--text-2); font-weight: 500; }

      .about { margin: 1.5rem 0 0; padding-top: 1.25rem; border-top: 1px solid var(--line); font-size: .82rem; color: var(--text-3); }
      .about p { margin: 0 0 .5rem; }
      .about p:last-child { margin: 0; }
      .about a { text-decoration-color: var(--line-2); text-underline-offset: 3px; }
      .about a:hover { color: var(--text); }

      .foot { margin: 1.25rem 0 0; text-align: center; font-size: .75rem; color: var(--text-3); line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <a class="lockup" href="/" style="font-size:.95rem;margin-bottom:1.1rem"><svg class="mark-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.08 6.9A8.5 8.5 0 0 1 17.92 6.9Z"></path><path d="M4.09 9.9A8.5 8.5 0 1 0 19.91 9.9Z"></path></svg>kese</a>
        <p class="eyebrow">Claim via STRK20</p>
        <h1>Claim your payment</h1>
        <div id="content"><p class="sub">Loading…</p></div>
      </div>
      <p class="foot">
        A claim link carries its secret after the <code>#</code>, keeping it out of page requests and
        referrer data. Anyone with the link can take the payment — treat it like cash.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
