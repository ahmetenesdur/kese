<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claim your payment — Kese</title>
    <!--
      No analytics, no fonts, no third-party anything. The URL fragment carries a bearer secret,
      and every extra script on this page is another party that could read it.
    -->
    <meta name="referrer" content="no-referrer" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #141822;
        --line: #232a38;
        --text: #e8ecf4;
        --muted: #98a2b8;
        --accent: #7c8cff;
        --warn: #f0b429;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 30rem; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.75rem;
      }
      h1 { margin: 0 0 .25rem; font-size: 1.35rem; letter-spacing: -0.01em; }
      .sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .9rem; }
      .amount { font-size: 2.25rem; font-weight: 650; letter-spacing: -0.02em; margin: .5rem 0; }
      .row {
        display: flex; justify-content: space-between; gap: 1rem;
        padding: .6rem 0; border-top: 1px solid var(--line);
        font-size: .875rem;
      }
      .row span:first-child { color: var(--muted); }
      .row code { font-size: .8rem; word-break: break-all; }
      button {
        width: 100%; margin-top: 1.25rem; padding: .8rem 1rem;
        font: inherit; font-weight: 600; color: #0b0d12;
        background: var(--accent); border: 0; border-radius: 9px; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .notice {
        margin-top: 1.25rem; padding: .85rem 1rem;
        background: rgba(240, 180, 41, .09);
        border: 1px solid rgba(240, 180, 41, .3);
        border-radius: 9px;
        font-size: .825rem; color: #f5d894;
      }
      .notice strong { color: var(--warn); }
      .status { margin-top: 1rem; font-size: .875rem; color: var(--muted); min-height: 1.2em; }
      .foot { margin-top: 1.25rem; font-size: .75rem; color: var(--muted); text-align: center; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Claim your payment</h1>
        <p class="sub">Paid privately through STRK20 · powered by Kese</p>
        <div id="content">Loading…</div>
      </div>
      <p class="foot">
        Your claim link is in this page's address, after the <code>#</code>. It is never sent to any
        server. Anyone who has it can claim this payment — treat it like cash.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
